<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoneyTracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="uang.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
    <h2>Yoshua’s Wallet</h2>
    
        <div class="dashboard-main">
            <div class="card-utama">
                <div class="header-saldo">
                    <span>TOTAL SALDO</span>
                    <button onclick="toggleSaldoVisibility()" id="btn-hide" style="background: none; border: none; cursor: pointer; padding: 0;">
                        <div style="position: relative; width: 24px; height: 24px; color: white;">
                            <svg id="eye-open" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" style="display: block;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eye-closed" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </div>
                    </button>
                </div>
                
                <h1 id="total-balance">Rp 0</h1>
                <div class="stats-mini">
                    <p>Jumlah Pemasukan: <span id="total-income" class="text-green">+ Rp 0</span></p><br>
                        <div id="month-label" style="font-size: 0.9rem; margin-bottom: 5px; opacity: 0.8;">
                        Pengeluaran : Semua Bulan
                    </div>
                    <p>Jumlah Pengeluaran: <span id="total-expense" class="text-red">- Rp 0</span></p>
                </div>
                <br>
                <div style="margin-top: 15px;">
                    <button onclick="toggleSearch()" class="btn-filter">Pencarian Transaksi</button>
                </div>
            </div>

            <div id="searchBar" class="search-bar">
                <input type="text" id="searchInput" placeholder="Cari transaksi..." onkeyup="filterTable()">
            </div>

        <div class="form-group">
            <div class="input-box">
                <label>Tipe</label>
                <select id="type">
                    <option value="expense">Pengeluaran</option>
                    <option value="income">Pemasukan</option>
                </select>
            </div>
            <div class="input-box">
                <label>Tanggal</label>
                <input type="date" id="date">
            </div>
            <div class="input-box">
                <label>Keterangan</label>
                <input type="text" id="desc" placeholder="Contoh: Gaji, Jajan...">
            </div>
            <div class="input-box">
                <label>Nominal</label>
                <input type="number" id="amount" placeholder="Rp">
            </div>
            <div class="input-box">
                <label>Kategori</label>
                <select id="category">
                    <option>Makan & Minum</option>
                    <option>Transportasi</option>
                    <option>Belanja</option>
                    <option>Gaji/Bonus</option>
                    <option>Hiburan</option>
                    <option>Lainnya</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="addTransaction()">Tambah</button>
        </div>

        <div class="header-actions" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
            <div class="menu-container" style="margin-bottom: 0;">
                <button class="btn-burger" onclick="toggleMenu()">
                    ☰ Pilih Bulan 
                </button>
                <div id="sideMenu" class="side-menu">
                    <div class="menu-header">
                        <span>Riwayat Bulan</span>
                        <button onclick="toggleMenu()">✕</button>
                    </div>
                    <div id="monthList" class="month-list"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-import" onclick="document.getElementById('importExcel').click()">📥 Import</button>
                <button class="btn btn-export" onclick="exportCSV()">📤 Export</button>
                <button class="btn btn-delete-all" onclick="clearAllData()">🗑️ Kosongkan</button>
            </div>
        </div>

        <div class="table-container responsive-table">
            <table>
                <thead>
                    <tr>
                        <th>Tgl</th>
                        <th>Keterangan</th>
                        <th>Kategori</th>
                        <th>Nominal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
        <br>
        <div class="chart-options" style="text-align: center; margin-bottom: 10px;">
            <button onclick="changeChartType('doughnut')">Lingkaran</button>
            <button onclick="changeChartType('bar')">Batang</button>
        </div>
        <div class="chart-section">
            <canvas id="expenseChart"></canvas>
        </div>

    </div> <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <input type="file" id="importExcel" accept=".xlsx, .xls" style="display:none" onchange="importFromExcel(event)">

    <script src="script.js"></script>
</body>
</html>
