<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="koin.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2> MAS YOS MONEY TRACKER </h2>

        <div class="dashboard-wrapper" style="display: flex; justify-content: center; margin-bottom: 25px;">
            <div class="card expense-minimal">
                <div class="card-icon">💸</div>
                <div class="card-info">
                    <span>Total Pengeluaran Bulan Ini</span>
                    <h3 id="total-expense">Rp 0</h3>
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="input-box">
                <label>Tipe</label>
                <select id="type">
                    <option value="expense">Pengeluaran</option>
                    <option value="income">Pemasukan</option>
                </select>
            </div>
            <div class="input-box">
                <label>Tanggal</label>
                <input type="date" id="date">
            </div>
            <div class="input-box">
                <label>Keterangan</label>
                <input type="text" id="desc" placeholder="Contoh: Gaji, Jajan...">
            </div>
            <div class="input-box">
                <label>Nominal</label>
                <input type="number" id="amount" placeholder="Rp">
            </div>
            <div class="input-box">
                <label>Kategori</label>
                <select id="category">
                    <option>Makan & Minum</option>
                    <option>Transportasi</option>
                    <option>Belanja</option>
                    <option>Gaji/Bonus</option>
                    <option>Hiburan</option>
                    <option>Lainnya</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="addTransaction()">Tambah</button>
        </div>

        <div class="header-actions" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
            <div class="menu-container" style="margin-bottom: 0;">
                <button class="btn-burger" onclick="toggleMenu()">
                    ☰ Pilih Bulan 
                </button>
                <div id="sideMenu" class="side-menu">
                    <div class="menu-header">
                        <span>Riwayat Bulan</span>
                        <button onclick="toggleMenu()">✕</button>
                    </div>
                    <div id="monthList" class="month-list"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-import" onclick="document.getElementById('importExcel').click()">📥 Import</button>
                <button class="btn btn-export" onclick="exportCSV()">📤 Export</button>
                <button class="btn btn-delete-all" onclick="clearAllData()">🗑️ Kosongkan</button>
            </div>
        </div>

        <div class="table-container responsive-table">
            <table>
                <thead>
                    <tr>
                        <th>Tgl</th>
                        <th>Keterangan</th>
                        <th>Kategori</th>
                        <th>Nominal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>

        <div class="chart-section">
            <canvas id="expenseChart"></canvas>
        </div>

    </div> <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <input type="file" id="importExcel" accept=".xlsx, .xls" style="display:none" onchange="importFromExcel(event)">

    <script src="script.js"></script>
</body>
</html>
